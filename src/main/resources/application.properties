spring.application.name=course-service
project.name=projectE
server.port=8082
catalog.service.url=http://localhost:8081
# application.properties
logging.level.root=INFO
logging.level.com.course=DEBUG
# Kafka Configuration
spring.kafka.bootstrap-servers=localhost:9092
# Kafka Topics
kafka.topic.course-published=course-published-topic

# AWS S3 Local Configuration (MinIO)
aws.s3.endpoint=http://localhost:9000
aws.s3.bucket-name=course-files-bucket
aws.s3.access-key=admin
aws.s3.secret-key=password123
aws.s3.region=us-east-1